name: Build Senpai APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract and Build
        run: |
          mkdir source
          unzip -q "SenpaiLauncher-alpha-0.2.0 (1).zip" -d source
          PROJECT_DIR="$(dirname "$(find source -name settings.gradle -print -quit)")"
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Senpai-Launcher-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
